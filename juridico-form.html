<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Candidatura - Jurídico</title>
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="stylesheet" href="src/form.css">
</head>
<body>
    <div class="form-container">
        <form id="juridico-form">
            <h2>Candidatura para Área Jurídica</h2>
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="player-id">Seu ID</label>
                <input type="number" id="player-id" name="player-id" required>
            </div>
            <div class="form-group">
                <label for="cargo">Cargo Desejado</label>
                <select id="cargo" name="cargo" required>
                    <option value="">Selecione um cargo...</option>
                    <option value="Advogado Publico">Advogado(a) Público(a)</option>
                    <option value="Procurador">Procurador(a)</option>
                    <option value="Assistente Juridico">Assistente Jurídico</option>
                </select>
            </div>
            <div class="form-group">
                <label for="experiencia">Experiência</label>
                <textarea id="experiencia" name="experiencia" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar Candidatura</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="src/juridico-form.js" type="module"></script>
</body>
</html>
