<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Candidatura - Polícia</title>
    <link rel="stylesheet" href="src/form.css">
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
</head>
<body>
    <div class="form-container">
        <form id="policia-form">
            <h2>Candidatura para a Polícia</h2>
            <div class="form-group">
                <label for="departamento">Departamento</label>
                <select id="departamento" name="departamento" required>
                    <option value="">Selecione um departamento...</option>
                    <option value="Policia Militar">Policia Militar</option>
                    <option value="Policia Civil">Policia Civil</option>
                    <option value="Bope">Bope</option>
                    <option value="PRF">PRF</option>
                    <option value="PF">PF</option>
                </select>
            </div>
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="player-id">Seu ID</label>
                <input type="number" id="player-id" name="player-id" required>
            </div>
            <div class="form-group">
                <label for="cargo">Cargo Desejado</label>
                <select id="cargo" name="cargo" required disabled>
                    <option value="">Selecione um departamento primeiro...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="experiencia">Experiência</label>
                <textarea id="experiencia" name="experiencia" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar Candidatura</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="src/policia-form.js"></script>
</body>
</html>
